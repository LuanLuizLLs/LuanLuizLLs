name: GitHub Metrics

on:
  # Permite execução manual do workflow
  workflow_dispatch:

  # Executa automaticamente todo dia às 6h da manhã (UTC)
  schedule:
    - cron: "0 6 * * *"

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LuanLuizLLs
          filename: assets/metrics.svg

          # Desativa todas as seções padrão
          base: ""

          # Configurações de exibição
          config_display: large
          extras_css: |
            h2 {
              color: #686868;
            }

          # Plugin de linguagens de programação
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_colors: 0:#686868, 1:#707070, 2:#787878, 3:#808080, 4:#909090, 5:#989898
          plugin_languages_limit: 6

          # Remove o título da seção e ajusta o layout
          config_order: languages
          config_timezone: America/Sao_Paulo
