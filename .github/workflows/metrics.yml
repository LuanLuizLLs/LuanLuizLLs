name: GitHub Metrics

on:
  # Permite execução manual do workflow
  workflow_dispatch:

  # Executa automaticamente todo dia às 6h da manhã (UTC)
  schedule:
    - cron: "0 6 * * *"

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LuanLuizLLs
          filename: assets/metrics.svg

          # Desativa todas as seções padrão (foto, nome, status, etc)
          base: ""

          # Plugin de linguagens de programação
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_colors: 0:#191919, 1:#2c2c2c, 2:#3f3f3f, 3:#545454, 4:#6a6a6a, 5:#808080
          plugin_languages_limit: 6

          # Remove o título da seção e ajusta o layout
          config_order: languages
          config_timezone: America/Sao_Paulo
